  <stop offset=".43" stop-color="#c2d5d5"/>
  <stop offset=".72" stop-color="#e5d4bd"/>
  <stop offset="1" stop-color="#bad0d3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
