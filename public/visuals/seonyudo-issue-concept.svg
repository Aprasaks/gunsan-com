<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="790" viewBox="0 0 1720 790" role="img" aria-labelledby="title">
<title id="title">군산 선유도 특집을 위한 가상의 바다와 유람선 콘셉트 일러스트</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2=".12" y2="1">
